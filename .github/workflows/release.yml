name: WLED Release CI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v1.0.0); an existing tag must match the selected ref'
        required: true
        type: string

permissions:
  contents: write

jobs:
  
  wled_build:
    uses: ./.github/workflows/build.yml
    
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: wled_build
    steps:
    - uses: actions/download-artifact@v4
      with:
        merge-multiple: true
    - name: Create draft release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ inputs.tag }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        draft: True
        files: |
          *.bin
          *.bin.gz

